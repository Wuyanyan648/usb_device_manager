# 安装到 /etc/systemd/system/usbdevd.service.d/10-user-session.conf（需要 root）
#
# 目的：让系统级（root）的 usbdevd 在「最后一个用户会话结束」时随
# user@<UID>.service 一起停止，与 usbnicd 的 10-screen-session.conf 同一策略。
# 登录后再由用户单元 usbdevd-session.service 拉起。
# 注意：若 loginctl show-user <user> -p Linger 为 yes，user@ 不会停，这段就不生效。
[Unit]
PartOf=user@UID@.service
